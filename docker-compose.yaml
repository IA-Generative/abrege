services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped

  abrege_service:
    deploy:
      replicas: 1
    command:
      [
        "celery",
        "-A",
        "abrege_service.main",
        "worker",
        "--loglevel=info",
        "--pool=prefork",
        "--concurrency=1",
        "-E",
        # Suppresses celery's plain-text startup banner (actual task/worker logs are
        # unaffected) - it's the one line of non-JSON noise this doesn't route through
        # the JSON logger, since celery prints it before logging is even configured.
        "--quiet",
      ]
    image: abrege-service
    mem_limit: 1g
    volumes:
      - ./apps/server/abrege_service/:/app/abrege_service/
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests/
    build:
      target: test
      context: .
      dockerfile: apps/server/abrege_service/Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      - OPENAI_API_MODEL=${OPENAI_API_MODEL}
    env_file:
      - .env

  # flower_abrege:
  #   image: abrege-service
  #   ports:
  #     - "5555:5555"
  #   command:
  #     [
  #       "celery",
  #       "-A",
  #       "abrege_service.main",
  #       "flower",
  #       "--address=0.0.0.0",
  #       "--port=5555",
  #     ]
  #   env_file:
  #     - .env

  abrege_api:
    image: abrege-api
    build:
      context: .
      dockerfile: apps/server/api/Dockerfile
    ports:
      - 5000:5000
    volumes:
      - ./apps/server/api/:/app/api/
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests/
    environment:
      DEV_MODE: "true"
      CELERY_APP_NAME: default
      VERIFY_TOKEN_MODEL: keycloak
    depends_on:
      - redis
      - minio
      - db
      - keycloak
    env_file:
      - .env

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    # Auto-provisions the "mirai" realm/client/test user below on every start, so local
    # login works out of the box without any manual admin-console setup.
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      # Without a fixed hostname, Keycloak derives the token `iss` from whichever Host
      # header reached it - the browser hits it as `localhost:8080`, but `abrege_api`
      # hits it as `keycloak:8080`. That mismatch makes Keycloak itself reject any
      # backend call carrying a token minted during the browser's `/auth` request
      # (token exchange, refresh, logout: "Invalid token issuer"). Pinning the hostname
      # makes Keycloak report the same issuer everywhere, regardless of which internal
      # path reached it - the backend still physically connects via `keycloak:8080`.
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8080
      - KC_HOSTNAME_STRICT=false
    volumes:
      - ./docker/keycloak/realm-mirai.json:/opt/keycloak/data/import/realm-mirai.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # KC_HEALTH_ENABLED serves /health on the management port (9000), not 8080.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: example_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  migration:
    image: abrege-migration
    build:
      context: .
      dockerfile: apps/server/migration/Dockerfile
    command:
      - alembic
      - upgrade
      - head
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/migration/:/app/migration
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  abrege_frontend:
    restart: always
    working_dir: /app
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    ports:
      - 8082:3000
    volumes:
      - ./apps/client:/app
      - /app/node_modules

  # llm_guard_api:
  #   image: laiyer/llm-guard-api:latest
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - AUTH_TOKEN=llm_guard
  #     - LOG_LEVEL=DEBUG
  #   volumes:
  #     - ./apps/server/llm-guard/config/scanners.yml:/home/user/app/config/scanners.yml

volumes:
  minio_data:
    driver: local

  postgres_data:
    driver: local
