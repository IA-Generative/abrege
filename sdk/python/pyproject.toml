[project]
name = "abrege-sdk"
version = "3.5.0-rc.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "boto3>=1.43.120",
    "celery>=5.6.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "python-json-logger>=4.2.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "ruff==0.15.22",
    "sqlalchemy>=2.1.6",
    "toml>=0.10.2",
]
[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "scripts/**",
]

line-length = 120
indent-width = 4
target-version = "py313"
src = ["abrege_sdk", "tests"]

[tool.isort]
src_paths = ["abrege_sdk", "tests"]


