repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.6.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: \.lock$

      - id: trailing-whitespace


  - repo: https://github.com/zricethezav/gitleaks
    # Matches ci.yml's scan-gitleaks pin. .gitleaks.toml's `targetRules` on allowlists
    # needs v8.25.0+ - below that, the pre-commit hook would silently ignore the
    # scoping and only ever apply the allowlist repo-wide (or not at all).
    rev: v8.30.1
    hooks:
      - id: gitleaks
