[project]
name = "abrege"
version = "3.4.0-rc.5"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.37",
    "celery[redis]>=5.6.3",
    "minio>=7.2.16",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-json-logger>=4.1.0",
    "sqlalchemy>=2.0.51",
    "flower>=2.0.1",
    "toml>=0.10.2",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]

migration = [
    "alembic>=1.19.2",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.52",
]
test = [
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.6",
    "pytest-dotenv>=0.5.2",
]
version = [
    "commitizen>=4.18.0",
]


abrege-api = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "python-magic>=0.4.27",
    "uvicorn>=0.52.4",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "python-keycloak>=7.1.1",
    "aiofiles>=25.1.0",
    "sentry-sdk[fastapi]>=2.68.1",
]
openai = [
    "openai>=3.8.0",
]
abrege-service = [
    "jinja2>=3.1.6",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "markitdown[docx,pdf,pptx,xlsx]==0.1.7",
    "moviepy>=2.2.1",
    "odfpy>=1.4.1",
    "openai>=3.8.0",
    "pdf2image>=1.17.0",
    "pydub>=0.25.1",
    "pymupdf4llm>=1.28.2",
    "pypandoc>=1.17",
    "python-keycloak>=7.1.1",
    "scrapling[fetchers]>=0.4.15",
    "spire-doc>=14.8.1",
    "tiktoken>=0.14.0",
    "transformers>=5.16.1",
    "unstructured>=0.27.5",
    "vosk==0.3.45",
    "sentry-sdk[celery]>=2.68.1",
]

evaluation = [
    "bert-score>=0.3.13",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "fastapi>=0.141.1",
    "hf-xet>=1.6.0",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "nltk>=3.10.3",
    "rouge-score>=0.1.2",
]



dev = [
    "ruff>=0.16.6",
]








[tool.pytest.ini_options]
env_override_existing_values = 1
env_files = ["tests/.env.testing"]

[tool.ruff]
line-length = 150

[tool.uv]
override-dependencies = [
    "pillow>=12.3.0",
]


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
  "pyproject.toml",
]
