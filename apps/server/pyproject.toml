[project]
name = "abrege"
version = "3.5.0-rc.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.120",
    "celery[redis]>=5.6.3",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.2",
    "python-json-logger>=4.2.0",
    # 2.1 makes psycopg 3 the default driver of plain `postgresql://` URLs, which is what
    # DATABASE_URL carries everywhere while the project installs psycopg2.
    "sqlalchemy>=2.0.55,<2.1",
    "toml>=0.10.2",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]

dev = [
    "ruff==0.15.22",
]
abrege-api = [
    "aiohttp>=3.14.5",
    "fastapi>=0.162.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "python-magic>=0.4.27",
    "uvicorn>=0.54.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "python-keycloak>=7.1.1",
    "aiofiles>=25.1.0",
    "sentry-sdk[fastapi]>=2.73.0",
]
version = [
    "commitizen>=4.19.3",
]
test = [
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.15.22",
    "pytest-dotenv>=0.5.2",
]
abrege-service = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langfuse>=5.0.4",
    "markitdown==0.1.9",
    "openai>=3.40.0",
    "pdf2image>=1.17.0",
    "python-keycloak>=7.1.1",
    "python-magic>=0.4.27",
    "scrapling[fetchers]>=0.5",
    "spire-doc>=14.9.1",
    "sentry-sdk[celery]>=2.73.0",
]
evaluation = [
    "bert-score>=0.3.13",
    "datasets>=5.1.0",
    "evaluate>=0.4.6",
    "fastapi>=0.162.0",
    "hf-xet>=1.7.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "nltk>=3.10.4",
    "rouge-score>=0.1.2",
]
openai = [
    "openai>=3.40.0",
]
migration = [
    "alembic>=1.20.1",
    "psycopg2-binary==2.9.13",
    "sqlalchemy>=2.0.55,<2.1",
]


[tool.pytest.ini_options]
env_override_existing_values = 1
env_files = ["tests/.env.testing"]

[tool.ruff]
line-length = 150

[tool.uv]
override-dependencies = [
    "pillow>=12.2.0",
]


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
  "pyproject.toml",
]
