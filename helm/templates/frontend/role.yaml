{{- if .Values.enabled }}
{{- if and .Values.frontend.serviceAccount.enabled .Values.frontend.serviceAccount.role.create .Values.frontend.serviceAccount.role.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "frontend")) | nindent 4 }}
rules: {{- toYaml .Values.frontend.serviceAccount.role.rules | nindent 0 }}
{{- end }}
{{- end }}
