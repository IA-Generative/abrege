{{- if .Values.enabled }}
{{- if and .Values.frontend.service.enabled (or (eq .Values.frontend.deploymentType "Deployment") (eq .Values.frontend.deploymentType "StatefulSet")) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "frontend")) | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.frontend.service.port | default 80 }}
    targetPort: {{ .Values.frontend.containerPortName | default .Values.frontend.containerPort | default 8080 }}
    protocol: {{ .Values.frontend.service.protocol | default "TCP" }}
    {{- if eq .Values.frontend.service.type "NodePort" }}
    nodePort: {{ .Values.frontend.service.nodePort }}
    {{- end }}
    name: {{ .Values.frontend.service.portName | default "http" }}
  {{- if .Values.frontend.service.extraPorts -}}
  {{- toYaml .Values.frontend.service.extraPorts | nindent 2 -}}
  {{- end }}
  selector: {{- include "helper.selectorLabels" (dict "root" . "componentName" "frontend") | nindent 4 }}
{{- end }}
{{- end }}
