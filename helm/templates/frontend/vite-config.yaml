{{- if .Values.enabled }}
{{- if .Values.frontend.viteEnv }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "vite-config" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "frontend")) | nindent 4 }}
data:
  config.js: |
    {{- include "helper.viteEnv" .Values.frontend.viteEnv | nindent 4 }}
{{- end }}
{{- end }}
