{{- if .Values.enabled }}
{{- if and .Values.frontend.serviceAccount.enabled .Values.frontend.serviceAccount.role.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "frontend")) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.frontend.serviceAccount.name | default (printf "%s-%s" (include "helper.fullname" .) "frontend") }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
