{{- if .Values.enabled }}
{{- if or .Values.frontend.envSecret .Values.global.envSecret -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "frontend" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "frontend")) | nindent 4 }}
data:
  {{- if .Values.global.envSecret -}}
  {{- include "helper.secret" .Values.global.envSecret | indent 2 }}
  {{- end -}}
  {{- if .Values.frontend.envSecret -}}
  {{- include "helper.secret" .Values.frontend.envSecret | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
