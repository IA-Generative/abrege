{{- if .Values.enabled }}
{{- if or .Values.worker.envCm .Values.global.envCm -}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "worker" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker")) | nindent 4 }}
data:
  {{- if .Values.global.envCm -}}
  {{- include "helper.env" .Values.global.envCm | indent 2 }}
  {{- end -}}
  {{- if .Values.worker.envCm -}}
  {{- include "helper.env" .Values.worker.envCm | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
