{{- if .Values.enabled }}
{{- if or .Values.worker.envSecret .Values.global.envSecret -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "worker" }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker")) | nindent 4 }}
data:
  {{- if .Values.global.envSecret -}}
  {{- include "helper.secret" .Values.global.envSecret | indent 2 }}
  {{- end -}}
  {{- if .Values.worker.envSecret -}}
  {{- include "helper.secret" .Values.worker.envSecret | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
