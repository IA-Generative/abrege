{{- if .Values.enabled }}
{{- if eq .Values.worker.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-%s" (include "helper.fullname" .) "worker" | trunc 63 | trimSuffix "-" }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "worker") | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker") | nindent 6 }}
  serviceName: {{ printf "%s-%s" (include "helper.fullname" .) "worker" | trunc 63 | trimSuffix "-" }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker" "component" .Values.worker) | nindent 4 }}
  {{- if or .Values.worker.volumeClaims .Values.worker.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.worker.volumeClaims) (default (list) .Values.worker.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
