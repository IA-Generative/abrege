apiVersion: v2
name: abrege
type: application
version: 0.1.0
appVersion: "0.1.0"
description: A Helm chart to deploy abrege.
# home: https://this-is-tobi.com
deprecated: false
annotations: {}
keywords: []
dependencies:
- name: redis
  alias: redis
  version: 0.27.9
  repository: oci://registry-1.docker.io/cloudpirates
  condition: redis.enabled
- name: postgres
  alias: postgres
  version: 0.19.6
  repository: oci://registry-1.docker.io/cloudpirates
  condition: postgres.enabled
- name: rustfs
  alias: rustfs
  version: 0.10.0
  repository: oci://registry-1.docker.io/cloudpirates
  condition: rustfs.enabled
- name: cluster
  alias: cnpg
  version: 0.8.1
  repository: https://cloudnative-pg.github.io/charts
  condition: cnpg.enabled
sources:
  - https://github.com/IA-Generative/abrege
maintainers: []
