services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: example_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    restart: unless-stopped

  rustfs:
    # Matches the bundled RustFS subchart used in prod (helm/values.yaml `rustfs`) instead
    # of MinIO, so the test suite exercises the same S3-compatible backend.
    image: rustfs/rustfs:1.0.0-beta.1
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_test_data:/data
    restart: unless-stopped

  migration:
    image: abrege-migration
    build:
      context: .
      dockerfile: apps/server/migration/Dockerfile
    command:
      - alembic
      - upgrade
      - head
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/migration/:/app/migration
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  test_runner:
    image: abrege-service
    build:
      target: test
      context: .
      dockerfile: apps/server/abrege_service/Dockerfile
    command:
      - uv
      - run
      - pytest
      - -s
      - --cov=./abrege_service/
      - --cov-report=term-missing
      - tests/abrege_service/
      - -ra
      - -v
      - --maxfail=1
    volumes:
      - ./apps/server/abrege_service/:/app/abrege_service/
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests/
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rustfs:
        condition: service_started
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_MODEL: ${OPENAI_API_MODEL}
      MAX_MODEL_TOKEN: 16300
    env_file:
      - .env
    mem_limit: 1g

volumes:
  postgres_test_data:
    driver: local
  rustfs_test_data:
    driver: local
