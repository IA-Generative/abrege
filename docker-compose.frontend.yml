services:
  abrege_frontend:
    container_name: abrege_frontend
    restart: always
    working_dir: /app
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      # Dérivée d'API_PORT : cf. docker-compose.yaml
      VITE_ABREGE_API_URL: http://localhost:${API_PORT:-5000}/api
    ports:
    - 8082:3000
    volumes:
    - ./apps/client:/app
    - /app/node_modules
